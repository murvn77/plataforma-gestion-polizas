services:

  db:
    image: postgres:16-alpine
    container_name: polizas-db
    environment:
      POSTGRES_DB: polizas
      POSTGRES_USER: polizas
      POSTGRES_PASSWORD: polizas
    volumes:
      - polizas-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polizas -d polizas"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: polizas-api:1.0.0
    container_name: polizas-api
    depends_on:
      db:
        condition: service_healthy   # el API arranca solo cuando la BD acepta conexiones
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/polizas
      DB_USER: polizas
      DB_PASSWORD: polizas
      API_KEY: "123456"
      IPC_PORCENTAJE: "5.20"
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  polizas-data:
